[package]
name = "aurora"
version = "0.3.0"
edition = "2024"
description = "Aurora: a web browser with a GPUI interface and the WebView2 engine"

[[bin]]
name = "aurora"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.10.0"
gpui-webview = "0.10.0"
# The wry fork gpui-webview is built on; listed so we can configure the builder.
wry = { package = "lb-wry", version = "0.53.3", features = ["devtools"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
url = "2.5"
ureq = "2.12"
# Chrome Web Store packages are zip files with a signed header in front.
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
# Same versions wry uses, for WebView2 features wry does not wrap.
webview2-com = "0.38"
windows-core = "0.61"

[build-dependencies]
embed-resource = "3"

[workspace]
exclude = ["legacy"]

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Nothing in the browser needs to unwind out of a panic (no FFI callback
# relies on it), so let the optimizer drop landing pads.
panic = "abort"
strip = "debuginfo"
