[package]
name = "aurora"
version = "0.2.0"
edition = "2024"
description = "Aurora: a web browser with a GPUI interface and the WebView2 engine"

[[bin]]
name = "aurora"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.10.0"
gpui-webview = "0.10.0"
# The wry fork gpui-webview is built on; listed so we can configure the builder.
wry = { package = "lb-wry", version = "0.53.3", features = ["devtools"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
url = "2.5"

[target.'cfg(windows)'.dependencies]
# Same version wry uses; needed for the BOOL type in WebView2 history calls wry does not wrap.
windows-core = "0.61"

[workspace]
exclude = ["legacy"]

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
[profile.release]
opt-level = 3
lto = "thin"
