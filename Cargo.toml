[package]
name = "chrust"
version = "0.4.3"
edition = "2024"
description = "Chrust: a web browser with a GPUI interface and the WebView2 engine"

[[bin]]
name = "chrust-port"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.10.0"
gpui-webview = "0.10.0"
# The wry fork gpui-webview is built on; listed so we can configure the builder.
wry = { package = "lb-wry", version = "0.53.3", features = ["devtools"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
url = "2.5"
ureq = "2.12"
# Chrome Web Store packages are zip files with a signed header in front.
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
# Brave's filter engine: Adblock Plus syntax, optimized matching. Single
# threaded edition, because the engine is built on whatever thread asked and
# then shared; see `adblock`.
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }

[target.'cfg(windows)'.dependencies]
# Same versions wry uses, for WebView2 features wry does not wrap.
webview2-com = "0.38"
windows-core = "0.61"
# Error codes from the engine, to recognise the one that means "retry".
windows = "0.61"

[build-dependencies]
embed-resource = "3"

[workspace]
exclude = ["legacy"]

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwinding stays on so the log in the data folder names where a crash
# happened instead of the window vanishing.
strip = "debuginfo"
debug = 1
