name: Release Linux

# Pushing a tag like v0.3.0 also builds a Linux executable.
# Needs WebKitGTK 4.1, which gpui-webview uses through wry. The window must run
# on X11 or XWayland; Wayland-only sessions open it through XWayland.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libssl-dev pkg-config patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p staging
          cp target/release/chrust staging/chrust
          cp assets/chrust/chrust-256.png staging/chrust.png
          cat > staging/chrust.desktop <<'DESKTOP'
          [Desktop Entry]
          Name=Chrust
          Comment=Web browser
          Exec=chrust
          Icon=chrust
          Terminal=false
          Categories=Network;WebBrowser;
          DESKTOP
          chmod +x staging/chrust
          chmod +x staging/chrust.desktop
          cd staging && tar -czf ../chrust-linux-x86_64.tar.gz chrust chrust.png chrust.desktop

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Windows job creates the release; wait briefly for it.
          for i in $(seq 1 60); do gh release view "${{ github.ref_name }}" >/dev/null 2>&1 && break; sleep 10; done
          gh release upload "${{ github.ref_name }}" chrust-linux-x86_64.tar.gz --clobber
