<!DOCTYPE html><html><head><title>Layout Test</title><style>
body { font-family: Segoe UI; margin: 0; background: #f3f4f6; }
.hero { height: 180px; background: linear-gradient(135deg, #4f46e5, #db2777); color: #fff; padding: 30px; }
.hero h1 { margin: 0; font-size: 40px; }
.wrap { display: flex; flex-wrap: wrap; gap: 16px; padding: 24px; }
.card { width: 180px; height: 120px; background: #fff; border: 1px solid #d1d5db; border-radius: 8px; padding: 12px; }
.card h3 { margin: 0 0 6px 0; font-size: 18px; }
</style></head><body>
<div class="hero"><h1>Gradients &amp; Flex Wrap</h1><p>Linear gradient background plus wrapping flex items.</p></div>
<div class="wrap">
<div class="card"><h3>One</h3><p>First card</p></div>
<div class="card"><h3>Two</h3><p>Second card</p></div>
<div class="card"><h3>Three</h3><p>Third card</p></div>
<div class="card"><h3>Four</h3><p>Fourth card</p></div>
<div class="card"><h3>Five</h3><p>Fifth card</p></div>
<div class="card"><h3>Six</h3><p>Sixth card</p></div>
<div class="card"><h3>Seven</h3><p>Seventh card</p></div>
</div>
</body></html>
